<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1220"><title>NeuroDevice · Demo iPhone</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7ff;min-height:100dvh;touch-action:manipulation}.app{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);max-width:680px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;color:#a8bad5;font-size:13px;letter-spacing:.08em}.brand{font-weight:800;color:#fff;letter-spacing:.02em}.pill{border:1px solid #35445f;border-radius:100px;padding:7px 11px}main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}h1{font-size:clamp(32px,8vw,46px);margin:0;letter-spacing:-.04em}p{color:#b4c1d7;line-height:1.55;margin:0}.card{background:#172339;border:1px solid #2a3b57;border-radius:22px;padding:22px}.stack{display:grid;gap:12px}button{font:inherit;border:0;border-radius:16px;padding:17px 20px;font-weight:750;cursor:pointer;min-height:56px}button.primary{background:#68e0bd;color:#09241e}button.secondary{background:#263752;color:#f5f8ff}button:disabled{opacity:.5}.subtle{font-size:13px;color:#91a4bf}.metric{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #32415b}.metric:last-child{border:0}.metric strong{font-variant-numeric:tabular-nums}.stimulus{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;user-select:none;-webkit-user-select:none;touch-action:none;padding:30px}.stimulus .symbol{font-size:min(36vw,170px);font-weight:850;line-height:1}.stimulus .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 35px);font-size:16px;color:#fff;opacity:.8}.stimulus .progress{position:absolute;top:calc(env(safe-area-inset-top) + 28px);font-size:14px;color:#fff;opacity:.75}.fix{background:#323b4c}.go{background:#08774f}.nogo{background:#a92c3a}.blank{background:#111827}.hidden{display:none!important}label{font-size:14px;color:#c7d5e8}select{background:#263752;color:#fff;border:1px solid #4a5a74;border-radius:12px;padding:12px;font:inherit;width:100%}footer{text-align:center;color:#8293ad;font-size:12px;padding-top:18px}</style></head><body><div class="app"><header><span class="brand">◈ NeuroDevice</span><span class="pill">iPhone · Demo 0.1</span></header><main id="main"></main><footer>Prototipo dimostrativo · Non per uso clinico</footer></div><div id="stim" class="stimulus hidden"><div class="progress" id="progress"></div><div class="symbol" id="symbol"></div><div class="hint" id="hint"></div></div><script>
'use strict';const main=document.getElementById('main'),overlay=document.getElementById('stim'),symbol=document.getElementById('symbol'),hint=document.getElementById('hint'),progress=document.getElementById('progress');let config={trials:12},session=null,running=false,phase='idle',responseTaken=false,trialStart=0,trialTimer=null,results=[],stimuli=[],index=0,token=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const rand=(a,b)=>a+Math.random()*(b-a);function view(html){main.innerHTML=html}function home(){running=false;phase='idle';overlay.className='stimulus hidden';view(`<div class="stack"><div><div class="subtle">BATTERIA COGNITIVA · VERSIONE DIMOSTRATIVA</div><h1>NeuroDevice</h1><p>Test di inibizione della risposta, progettato per una prima prova su iPhone.</p></div><div class="card stack"><h2 style="margin:0">Go / No-Go</h2><p><strong>GO verde:</strong> tocca lo schermo rapidamente.<br><strong>X rossa:</strong> non toccare lo schermo.</p><label for="trials">Numero di prove</label><select id="trials"><option value="8">8 · prova rapida</option><option value="12" selected>12 · demo</option><option value="20">20 · standard</option></select><button class="primary" id="start">Avvia il test</button></div><p class="subtle">I risultati rimangono in questa pagina finché non li esporti. Usa solo dati di prova.</p></div>`);document.getElementById('start').onclick=()=>{config.trials=Number(document.getElementById('trials').value);instructions()}}function instructions(){view(`<div class="stack"><h1>Preparati</h1><div class="card stack"><p>Appoggia il telefono su una superficie stabile e usa un dito per rispondere.</p><p>Quando compare <strong>GO</strong> su sfondo verde, tocca una volta lo schermo. Quando compare una <strong>X</strong> rossa, attendi senza toccare.</p><p>Ogni stimolo rimane visibile per massimo 2 secondi. Il test parte dopo un conto alla rovescia.</p></div><button class="primary" id="begin">Inizia</button><button class="secondary" id="back">Indietro</button></div>`);document.getElementById('begin').onclick=start;document.getElementById('back').onclick=home}function show(type,txt,sub){overlay.className='stimulus '+type;symbol.textContent=txt;hint.textContent=sub||'';progress.textContent=running?`Prova ${Math.min(index+1,stimuli.length)} di ${stimuli.length}`:''}function hide(){overlay.className='stimulus hidden'}async function start(){if(running)return;running=true;token++;const myToken=token;results=[];index=0;session={session_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),session_start_utc:new Date().toISOString(),device:'iPhone web prototype',test_name:'go_nogo',config:{...config,go_ratio:0.7,response_window_ms:2000}};stimuli=Array.from({length:config.trials},(_,i)=>i<Math.floor(config.trials*.7)?'GO':'NOGO');for(let i=stimuli.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[stimuli[i],stimuli[j]]=[stimuli[j],stimuli[i]]}for(let n=3;n>0;n--){if(token!==myToken)return;show('blank',String(n),'Non toccare durante il conto alla rovescia');await sleep(650)}for(index=0;index<stimuli.length;index++){if(token!==myToken)return;phase='fixation';show('fix','+','');await sleep(rand(1000,1800));if(token!==myToken)return;phase='stimulus';responseTaken=false;let stim=stimuli[index];show(stim==='GO'?'go':'nogo',stim==='GO'?'GO':'X',stim==='GO'?'TOCCA ORA':'NON TOCCARE');trialStart=performance.now();const onset=trialStart;await new Promise(resolve=>{trialTimer=setTimeout(resolve,2000);window.finishTrial=resolve});if(token!==myToken)return;const record=results[index];if(!record){results.push({trial_index:index,stimulus:stim,response:false,correct:stim==='NOGO',reaction_time_ms:null,timestamp_utc:new Date().toISOString()})}phase='intertrial';show('blank','','');await sleep(240)}phase='done';running=false;hide();summary()}function respond(e){if(!running||phase!=='stimulus'||responseTaken)return;if(e.cancelable)e.preventDefault();responseTaken=true;let stim=stimuli[index],rt=Math.round(performance.now()-trialStart);results.push({trial_index:index,stimulus:stim,response:true,correct:stim==='GO',reaction_time_ms:rt,timestamp_utc:new Date().toISOString()});clearTimeout(trialTimer);window.finishTrial?.()}overlay.addEventListener('pointerdown',respond,{passive:false});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&running){token++;running=false;clearTimeout(trialTimer);hide();home()}else if(e.code==='Space'&&running){respond(e)}});function summary(){const correct=results.filter(r=>r.correct).length,commission=results.filter(r=>r.stimulus==='NOGO'&&r.response).length,omission=results.filter(r=>r.stimulus==='GO'&&!r.response).length,rts=results.filter(r=>r.stimulus==='GO'&&r.correct&&r.reaction_time_ms!==null).map(r=>r.reaction_time_ms);const avg=rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length):null;session.session_end_utc=new Date().toISOString();session.trials=results;session.summary={n_trials:results.length,accuracy:results.length?correct/results.length:null,commission_errors:commission,omission_errors:omission,mean_rt_go_ms:avg};view(`<div class="stack"><div class="subtle">TEST COMPLETATO</div><h1>Risultati</h1><div class="card"><div class="metric"><span>Accuratezza</span><strong>${Math.round(100*session.summary.accuracy)}%</strong></div><div class="metric"><span>Prove completate</span><strong>${results.length}</strong></div><div class="metric"><span>Errori di commissione</span><strong>${commission}</strong></div><div class="metric"><span>Omissioni</span><strong>${omission}</strong></div><div class="metric"><span>RT medio GO corrette</span><strong>${avg===null?'N/D':avg+' ms'}</strong></div></div><button class="primary" id="export">Esporta risultati JSON</button><button class="secondary" id="restart">Nuovo test</button><p class="subtle">Misure esplorative: la latenza del display, Safari e il touchscreen non sono calibrati per uso clinico.</p></div>`);document.getElementById('export').onclick=exportJSON;document.getElementById('restart').onclick=home}function exportJSON(){if(!session)return;const blob=new Blob([JSON.stringify(session,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`neurodevice_${session.session_id}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}home();</script></body></html>
